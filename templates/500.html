{% extends "base.html" %}
{% block title %}500 – Server Error{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center min-vh-100">
  <div class="text-center">
    <div style="font-size:6rem; line-height:1;">⚠️</div>
    <h1 class="display-1 fw-800 text-danger mt-3">500</h1>
    <h2 class="h4 text-white mb-3">Internal Server Error</h2>
    <p class="text-muted mb-4">Something went wrong on our end. Please try again later.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary-custom btn-lg">
      <i class="bi bi-house-fill me-2"></i>Back to Dashboard
    </a>
  </div>
</div>
{% endblock %}
